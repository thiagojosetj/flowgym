# Continuous integration: the same gate that has to be green before every commit.
#
# Why these four tasks, in this order:
#   :domain:test            - pure Java rules; fastest feedback, no Android at all.
#   :app:testDebugUnitTest  - Robolectric + Room on the JVM (no device needed).
#   :app:lintDebug          - checkDependencies = true, so it also analyses :domain,
#                             which is the only lint coverage that module gets.
#   assembleRelease         - proves R8 (minify + shrink) still builds a shippable APK;
#                             a missing keep rule only shows up here, never in debug.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Read-only token: this workflow never writes to the repository.
permissions:
  contents: read

# A new push to the same ref makes the previous run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android-app

jobs:
  gate:
    name: tests + lint + release build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up the JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # The Gradle JDK is 21; the modules still compile against the Java 17 API
          # (options.release = 17), so this does not widen what the app can call.
          java-version: "21"

      - name: Install the Android SDK packages this project compiles against
        uses: android-actions/setup-android@v4
        with:
          # compileSdk = release(37) resolves to the versioned platform directory
          # android-37.0. The hosted runner does not ship it, so install it explicitly
          # instead of relying on whatever the image happens to contain.
          packages: "platforms;android-37.0 build-tools;37.0.0"

      - name: Set up Gradle (with dependency and build cache)
        uses: gradle/actions/setup-gradle@v6
        with:
          # No build-root-directory: v6 dropped that input and warns twice per run that it is
          # ignoring it. The gate does not need it - the cache keys off GRADLE_USER_HOME, and the
          # steps below find the wrapper through defaults.run.working-directory.
          # Only the default branch refreshes the shared cache; branches read it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          # Also verifies the checksum of gradle-wrapper.jar (supply-chain check).
          validate-wrappers: true

      # Writes the release key to a file OUTSIDE the checkout, only when the repository has the
      # secret. Without it every step below still runs and the release APK comes out unsigned,
      # exactly as before, so a fork and a pull request from one are not broken by a key they
      # cannot have. GitHub masks the secret in the log; the file is on the runner's disk, which is
      # destroyed with the job.
      - name: Make the release signing key available
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.FLOWGYM_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          # The shell decides, not an `if:` expression: whether a secret is readable from a step
          # condition depends on context rules that differ between event types, and a condition
          # that silently evaluates false would skip signing without saying why.
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "No release key configured for this repository; the release APK stays unsigned."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/flowgym-release.jks"
          echo "keystore=$RUNNER_TEMP/flowgym-release.jks" >> "$GITHUB_OUTPUT"
          echo "Release key loaded; the APK will be signed and published."

      - name: Run the gate
        env:
          # Empty when the secret is absent, and the build then skips the signing config entirely.
          FLOWGYM_KEYSTORE_FILE: ${{ steps.signing.outputs.keystore }}
          FLOWGYM_KEYSTORE_PASSWORD: ${{ secrets.FLOWGYM_KEYSTORE_PASSWORD }}
          FLOWGYM_KEY_ALIAS: ${{ secrets.FLOWGYM_KEY_ALIAS }}
          FLOWGYM_KEY_PASSWORD: ${{ secrets.FLOWGYM_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :domain:test :app:testDebugUnitTest :app:lintDebug assembleRelease

      # abortOnError only fails the build on lint *errors*. The project's bar is zero
      # findings of any severity, so the job asserts that itself instead of turning
      # warnings into errors globally (which would also change local builds).
      - name: Fail if lint reported anything at all
        run: |
          set -euo pipefail
          report=app/build/reports/lint-results-debug.xml
          if [ ! -f "$report" ]; then
            echo "::error::lint report not found at android-app/$report - the lint task did not produce one"
            exit 1
          fi
          # Parsed as XML, not grepped. Lint writes "<issue" followed by a newline with the
          # attributes on the lines below, so a pattern like '<issue ' matches nothing and a
          # pattern like '<issue' also matches the "<issues>" root element. The first version of
          # this step used the former and would have reported zero findings for ever - a gate that
          # cannot fail is worse than no gate, because it is believed.
          python3 - "$report" <<'PY'
          import sys, xml.etree.ElementTree as ET
          # AndroidGradlePluginVersion asks a remote version list whether something newer exists,
          # so it goes red on its own schedule with no change to this repository. It is advice
          # about the toolchain, not a defect in the code under review, and a gate that fails for
          # reasons no commit can fix is a gate people learn to ignore. Every other check counts.
          ADVISORY = {"AndroidGradlePluginVersion"}
          issues = ET.parse(sys.argv[1]).getroot().findall("issue")
          blocking = [i for i in issues if i.get("id") not in ADVISORY]
          for i in issues:
              mark = "advisory" if i.get("id") in ADVISORY else "BLOCKING"
              print(f"[{mark}] {i.get('id')} ({i.get('severity')}): {i.get('message')}")
          if blocking:
              print(f"::error::lint reported {len(blocking)} finding(s); the bar here is zero")
              sys.exit(1)
          print(f"lint: 0 blocking findings ({len(issues) - len(blocking)} advisory)")
          PY

      # The phone install. Only the signed APK is published: an unsigned one cannot be installed,
      # so offering it would be offering a file that does nothing.
      - name: Publish the installable APK
        if: ${{ steps.signing.outputs.keystore != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: flowgym-apk-${{ github.sha }}
          if-no-files-found: error
          path: android-app/app/build/outputs/apk/release/app-release.apk

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          if-no-files-found: ignore
          path: |
            android-app/app/build/reports/
            android-app/app/build/test-results/
            android-app/domain/build/reports/
            android-app/domain/build/test-results/
