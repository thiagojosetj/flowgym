# Gradle daemon memory. Room's annotation processor and R8 like having some headroom.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX is the default since AGP 9; kept explicit for readability.
android.useAndroidX=true

# ADR-0025: AGP 9's built-in Kotlin support stays at its default (on). The opt-out flag is
# deprecated and will be removed in AGP 10; with no Kotlin sources its tasks do nothing.
